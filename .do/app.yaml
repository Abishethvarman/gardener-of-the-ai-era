# DigitalOcean App Platform spec. Replace YOUR_GITHUB_USER/gardener, then:
#   doctl apps create --spec .do/app.yaml
#
# App Platform web services are paid (there's no free tier for them), so this
# uses the smallest slug that the docs list. The model runs elsewhere: point
# GARDENER_LLM_URL at a GPU Droplet running Ollama or vLLM, or leave the model
# off and the built-in writer answers.
name: gardener
region: nyc
services:
  - name: web
    github:
      repo: YOUR_GITHUB_USER/gardener
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /api/health
    envs:
      - key: GARDENER_LLM
        value: "off"
        scope: RUN_TIME
      - key: GARDENER_MODEL
        value: gemma3:4b
        scope: RUN_TIME
      - key: GARDENER_LLM_URL
        value: http://YOUR_GPU_DROPLET_IP:11434/v1
        scope: RUN_TIME
